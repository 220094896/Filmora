<section class="auth-page">

  <div class="auth-card">

    <div class="text-center mb-4">

      <h2>
        Welcome Back
      </h2>

      <p class="text-muted">
        Login to your Filmora account
      </p>

    </div>


    @if (error) {

      <div class="alert alert-danger">
        {{ error }}
      </div>

    }


    <form
      (ngSubmit)="login()"
    >

      <div class="mb-3">

        <label class="form-label">
          Email
        </label>

        <input
          type="email"
          class="form-control"
          name="email"
          [(ngModel)]="email"
          required
        >

      </div>


      <div class="mb-4">

        <label class="form-label">
          Password
        </label>

        <input
          type="password"
          class="form-control"
          name="password"
          [(ngModel)]="password"
          required
        >

      </div>


      <button
        class="btn btn-gold w-100"
        [disabled]="loading"
      >

        @if (loading) {
          Logging in...
        } @else {
          Login
        }

      </button>

    </form>


    <p class="text-center mt-4">

      Don't have an account?

      <a routerLink="/register">
        Register
      </a>

    </p>

  </div>

</section>
